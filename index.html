<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="签到">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>签到</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307c160'/%3E%3Cpath d='M18 33l9 9 19-21' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="application-name" content="签到">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --green:#07c160;
    --bg:#f5f6f8;
    --text:#1f2329;
    --text-2:#4e5969;
    --text-3:#8f959e;
    --red:#e5484d;
    --shell:480px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }
  body.lock{overflow:hidden}
  button{font:inherit;color:inherit}
  button:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  /* ---------- 顶部 ---------- */
  .app{max-width:var(--shell);margin:0 auto;padding:0 16px calc(130px + env(safe-area-inset-bottom))}
  .hero{padding:22px 4px 18px}
  .hero-date{font-size:26px;font-weight:700;line-height:1.2;letter-spacing:.5px}
  .hero-sub{margin-top:6px;font-size:13px;color:var(--text-3)}
  .footnote{margin:26px 0 0;text-align:center;font-size:11px;color:#b0b6be}

  /* ---------- 任务卡片 ---------- */
  .card{
    display:flex;align-items:center;
    padding:14px;margin-bottom:10px;
    background:#fff;border-radius:12px;
    box-shadow:0 2px 8px rgba(31,35,41,.05);
    cursor:pointer;
  }
  .card:active{background:#fafbfc}
  .card-main{flex:1;min-width:0;padding-right:10px}
  .card-title-line{line-height:1.5}
  .card-title{font-size:16px;font-weight:600;word-break:break-all}
  .days-chip{
    display:inline-block;margin-left:6px;padding:1px 7px;
    border-radius:999px;background:rgba(7,193,96,.1);color:var(--green);
    font-size:11px;font-weight:500;vertical-align:2px;white-space:nowrap;
  }
  .card-meta{margin-top:5px;font-size:12px;color:var(--text-3)}
  .check-btn{
    flex:none;width:74px;height:34px;padding:0;border:0;border-radius:17px;
    background:var(--green);color:#fff;font-size:13px;font-weight:500;cursor:pointer;
  }
  .check-btn.is-checked{background:rgba(7,193,96,.12);color:var(--green)}

  /* ---------- 空状态 ---------- */
  .empty{padding:70px 20px 0;text-align:center}
  .empty-icon{
    width:64px;height:64px;line-height:64px;margin:0 auto 16px;
    border-radius:50%;background:#fff;color:#c9cdd4;font-size:30px;
    box-shadow:0 2px 8px rgba(31,35,41,.05);
  }
  .empty-title{font-size:15px;font-weight:600;color:var(--text-2)}
  .empty-desc{margin-top:6px;font-size:12px;color:#a8adb5}

  /* ---------- 新建 ---------- */
  .fab{
    position:fixed;
    right:max(20px,calc((100% - var(--shell))/2 + 20px));
    bottom:calc(28px + env(safe-area-inset-bottom));
    z-index:30;
    display:flex;align-items:center;justify-content:center;
    width:54px;height:54px;
    border:0;border-radius:50%;background:var(--green);color:#fff;
    font-size:28px;line-height:1;cursor:pointer;
    box-shadow:0 5px 12px rgba(7,193,96,.32);
  }
  .fab:active{background:#06ad56}

  /* ---------- 弹层 ---------- */
  .overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,.45);
    animation:fade .18s ease-out;
  }
  .overlay[hidden]{display:none}
  .sheet{
    width:100%;max-width:var(--shell);
    padding:20px 16px calc(16px + env(safe-area-inset-bottom));
    background:#fff;border-radius:16px 16px 0 0;
    animation:up .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet-title{margin:0;font-size:17px;font-weight:700}
  .sheet-desc{margin:5px 0 0;font-size:12px;color:var(--text-3)}
  .input{
    width:100%;height:44px;margin-top:14px;padding:0 12px;
    border:0;border-radius:8px;background:#f5f6f8;
    font-size:16px;color:var(--text);outline:none;
  }
  .input::placeholder{color:#b0b6be}
  .sheet-actions{display:flex;margin-top:16px}
  .btn{
    flex:1;height:44px;padding:0;border:0;border-radius:22px;
    font-size:15px;font-weight:500;cursor:pointer;
  }
  .btn-cancel{margin-right:10px;background:#f5f6f8;color:var(--text-2)}
  .btn-primary{background:var(--green);color:#fff}
  .btn-primary.danger{background:var(--red)}

  /* ---------- 详情 ---------- */
  .sheet-detail{
    max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-top:18px;
  }
  .detail-head{display:flex;align-items:center}
  .detail-title{flex:1;min-width:0;font-size:18px;font-weight:700;word-break:break-all}
  .detail-badge{
    flex:none;margin-left:10px;padding:3px 9px;border-radius:999px;
    background:rgba(7,193,96,.1);color:var(--green);font-size:11px;font-weight:500;
  }
  .detail-sub{margin-top:4px;font-size:12px;color:var(--text-3)}
  .stat-row{display:flex;margin-top:14px;padding:12px 0;background:#f7f8fa;border-radius:10px}
  .stat{flex:1;text-align:center}
  .stat + .stat{border-left:1px solid #ebedf0}
  .stat-num{font-size:20px;font-weight:700;line-height:1.2}
  .stat-num.is-missed{color:var(--red)}
  .stat-label{margin-top:3px;font-size:11px;color:var(--text-3)}
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
  .month-label{font-size:14px;font-weight:600}
  .nav-btn{
    width:32px;height:32px;padding:0;border:0;border-radius:16px;
    background:#f5f6f8;color:var(--text-2);font-size:18px;line-height:1;cursor:pointer;
  }
  .nav-btn.is-disabled{opacity:.3;cursor:default}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-top:8px}
  .cal-weekdays span{text-align:center;font-size:11px;color:var(--text-3)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-cell{
    display:flex;align-items:center;justify-content:center;
    height:42px;padding:0;border:0;background:none;cursor:pointer;
  }
  .cal-cell[aria-disabled="true"]{cursor:default}
  .cal-day{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:50%;font-size:13px;color:var(--text-2);
  }
  .cal-day.chk{background:var(--green);color:#fff;font-weight:600}
  .cal-day.miss{background:#fdecec;color:var(--red)}
  .cal-day.pend{color:var(--green);font-weight:600;border:1.5px dashed var(--green)}
  .cal-day.fut{color:#c9cdd4}
  .cal-day.pre{color:#e0e4e9}
  .cal-day.today::after{
    content:"";position:absolute;bottom:3px;left:50%;margin-left:-3px;
    width:6px;height:6px;border-radius:50%;background:var(--green);
  }
  .cal-day.today.chk::after{background:#fff}
  .cal-day.pend::after{display:none}
  .legend{display:flex;justify-content:center;margin-top:12px}
  .legend-item{display:flex;align-items:center;margin:0 7px;font-size:11px;color:var(--text-3)}
  .legend-dot{width:10px;height:10px;margin-right:4px;border-radius:50%}
  .dot-chk{background:var(--green)}
  .dot-miss{background:#fdecec;border:1px solid #f7c8c8}
  .dot-pend{border:1.5px dashed var(--green)}
  .detail-tip{margin-top:8px;font-size:11px;color:#b0b6be;text-align:center}
  .detail-foot{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:14px;padding-top:12px;border-top:1px solid #f0f1f3;
  }
  .btn-text{padding:6px 10px;border:0;background:none;font-size:14px;color:var(--text-2);cursor:pointer}
  .btn-danger{color:var(--red)}

  /* ---------- 确认框 ---------- */
  .sheet-confirm{padding:22px 20px calc(18px + env(safe-area-inset-bottom));text-align:center}
  .confirm-title{font-size:17px;font-weight:700}
  .confirm-text{margin-top:7px;font-size:13px;line-height:1.6;color:var(--text-3)}
  .confirm-actions{display:flex;margin-top:18px}

  /* ---------- 提示 ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));
    z-index:200;max-width:80%;padding:9px 15px;border-radius:8px;
    background:rgba(0,0,0,.78);color:#fff;font-size:13px;line-height:1.4;
    transform:translate(-50%,8px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="app">
  <header class="hero">
    <div class="hero-date" id="heroDate"></div>
    <div class="hero-sub" id="heroSub"></div>
  </header>
  <main class="list" id="list"></main>
  <p class="footnote">数据只保存在这台设备的浏览器里</p>
</div>

<button type="button" class="fab" data-action="open-editor" aria-label="新建签到任务">＋</button>

<div class="overlay" id="editorOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <h2 class="sheet-title" id="editorTitle">新建签到任务</h2>
    <p class="sheet-desc">每天签到一次，累计天数会显示在任务标题后面</p>
    <input class="input" id="taskInput" maxlength="20" autocomplete="off"
           enterkeyhint="done" placeholder="任务名称，如早起、读书">
    <div class="sheet-actions">
      <button type="button" class="btn btn-cancel" data-action="close-editor">取消</button>
      <button type="button" class="btn btn-primary" data-action="create">创建</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay" hidden>
  <div class="sheet sheet-detail" role="dialog" aria-modal="true" aria-label="任务详情">
    <div id="detailBody"></div>
  </div>
</div>

<div class="overlay" id="confirmOverlay" hidden>
  <div class="sheet sheet-confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-title" id="confirmTitle"></div>
    <div class="confirm-text" id="confirmText"></div>
    <div class="confirm-actions">
      <button type="button" class="btn btn-cancel" data-action="confirm-no">取消</button>
      <button type="button" class="btn btn-primary" id="confirmYes" data-action="confirm-yes">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'checkin_tasks_v1';
  var MAX_TITLE = 20;
  var MAX_TASKS = 100;
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];

  /* ================= 日期 ================= */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseDate(key) {
    var p = key.split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function todayKey() { return fmtDate(new Date()); }
  function shiftDay(key, delta) {
    var d = parseDate(key);
    d.setDate(d.getDate() + delta);
    return fmtDate(d);
  }
  function isDateKey(v) { return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v); }
  function humanDate(key, today) {
    var d = parseDate(key);
    var md = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    return d.getFullYear() === parseDate(today).getFullYear() ? md : d.getFullYear() + '年' + md;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ================= 存储 ================= */
  var memory = null;

  function newId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function readRaw() {
    try {
      var text = localStorage.getItem(STORAGE_KEY);
      return text ? JSON.parse(text) : [];
    } catch (e) {
      return memory || [];
    }
  }
  function writeRaw(list) {
    memory = list;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }
  function normalize(list) {
    if (!Array.isArray(list)) return [];
    var out = [];
    var seenId = {};
    list.forEach(function (item) {
      if (!item || typeof item !== 'object') return;
      var title = typeof item.title === 'string' ? item.title.trim() : '';
      if (!title) return;

      var id = typeof item.id === 'string' && item.id ? item.id : '';
      if (!id || seenId[id]) id = newId();
      seenId[id] = true;

      var days = [];
      var seenDay = {};
      (Array.isArray(item.days) ? item.days : []).forEach(function (d) {
        if (!isDateKey(d) || seenDay[d]) return;
        seenDay[d] = true;
        days.push(d);
      });
      days.sort();

      out.push({
        id: id,
        title: title.slice(0, MAX_TITLE),
        createdAt: isDateKey(item.createdAt) ? item.createdAt : todayKey(),
        days: days
      });
    });
    return out.slice(0, MAX_TASKS);
  }

  /* ================= 统计 ================= */
  function stats(task, today) {
    var set = {};
    (task.days || []).forEach(function (d) { set[d] = true; });
    var checkedToday = !!set[today];

    var anchor = checkedToday ? today : shiftDay(today, -1);
    var streak = 0;
    while (set[anchor] && streak < 4000) {
      streak += 1;
      anchor = shiftDay(anchor, -1);
    }

    var missed = 0;
    var cursor = task.createdAt;
    var stop = shiftDay(today, -1);
    var guard = 0;
    while (cursor <= stop && guard < 4000) {
      if (!set[cursor]) missed += 1;
      cursor = shiftDay(cursor, 1);
      guard += 1;
    }

    return { total: task.days.length, streak: streak, missed: missed, checkedToday: checkedToday };
  }

  /* ================= 状态 ================= */
  var state = {
    tasks: [],
    today: todayKey(),
    detailId: null,
    viewYear: 0,
    viewMonth: 0,
    startYear: 0,
    startMonth: 0
  };

  function findTask(id) {
    for (var i = 0; i < state.tasks.length; i += 1) {
      if (state.tasks[i].id === id) return state.tasks[i];
    }
    return null;
  }

  /* ================= 渲染 ================= */
  function render() {
    state.today = todayKey();
    var d = parseDate(state.today);
    var checked = 0;
    var html = state.tasks.map(function (t) {
      var s = stats(t, state.today);
      if (s.checkedToday) checked += 1;
      return cardHtml(t, s);
    }).join('');

    var sub = d.getFullYear() + '年 · 星期' + WEEK[d.getDay()];
    if (state.tasks.length) sub += ' · 今日已签到 ' + checked + '/' + state.tasks.length;

    document.getElementById('heroDate').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    document.getElementById('heroSub').textContent = sub;
    document.getElementById('list').innerHTML = html || emptyHtml();
  }

  function cardHtml(t, s) {
    return '<article class="card" data-id="' + esc(t.id) + '">' +
      '<div class="card-main">' +
        '<div class="card-title-line">' +
          '<span class="card-title">' + esc(t.title) + '</span>' +
          '<span class="days-chip">已签到 ' + s.total + ' 天</span>' +
        '</div>' +
        '<div class="card-meta">连续签到 ' + s.streak + ' 天 · 开始于 ' +
          esc(humanDate(t.createdAt, state.today)) + '</div>' +
      '</div>' +
      '<button type="button" class="check-btn' + (s.checkedToday ? ' is-checked' : '') + '"' +
        ' data-action="toggle-today" data-id="' + esc(t.id) + '">' +
        (s.checkedToday ? '已签到' : '签到') +
      '</button>' +
    '</article>';
  }

  function emptyHtml() {
    return '<div class="empty">' +
      '<div class="empty-icon">✓</div>' +
      '<div class="empty-title">还没有签到任务</div>' +
      '<div class="empty-desc">点右下角的 ＋ 新建一个，比如早起、健身、读书</div>' +
    '</div>';
  }

  /* ================= 新建任务 ================= */
  function openEditor() {
    var input = document.getElementById('taskInput');
    input.value = '';
    showOverlay('editorOverlay');
    setTimeout(function () { input.focus(); }, 80);
  }
  function closeEditor() {
    hideOverlay('editorOverlay');
  }
  function createTask() {
    var input = document.getElementById('taskInput');
    var title = (input.value || '').trim();
    if (!title) { toast('给任务起个名字吧'); return; }
    state.tasks.unshift({
      id: newId(),
      title: title.slice(0, MAX_TITLE),
      createdAt: state.today,
      days: []
    });
    commit();
    closeEditor();
    toast('任务已创建');
  }

  /* ================= 签到 ================= */
  function toggleToday(id) {
    var task = findTask(id);
    if (!task) return;

    if (task.days.indexOf(state.today) >= 0) {
      askConfirm({
        title: '取消今日签到？',
        text: '取消后连续签到天数会重新计算',
        confirmText: '取消签到',
        danger: true
      }).then(function (ok) {
        if (!ok) return;
        task.days.splice(task.days.indexOf(state.today), 1);
        commit();
        toast('已取消今日签到');
      });
      return;
    }

    task.days.push(state.today);
    task.days.sort();
    commit();
    var s = stats(task, state.today);
    toast(s.streak > 1 ? '已连续签到 ' + s.streak + ' 天' : '签到成功');
  }

  /* ================= 详情 ================= */
  function openDetail(id) {
    var task = findTask(id);
    if (!task) return;
    state.detailId = id;

    var td = parseDate(state.today);
    var sd = parseDate(task.createdAt);
    state.viewYear = td.getFullYear();
    state.viewMonth = td.getMonth() + 1;
    state.startYear = sd.getFullYear();
    state.startMonth = sd.getMonth() + 1;

    renderDetail();
    showOverlay('detailOverlay');
  }

  function closeDetail() {
    state.detailId = null;
    hideOverlay('detailOverlay');
  }

  function renderDetail() {
    var task = findTask(state.detailId);
    if (!task) { closeDetail(); return; }

    var s = stats(task, state.today);
    var td = parseDate(state.today);
    var canPrev = state.viewYear > state.startYear ||
      (state.viewYear === state.startYear && state.viewMonth > state.startMonth);
    var canNext = state.viewYear < td.getFullYear() ||
      (state.viewYear === td.getFullYear() && state.viewMonth < td.getMonth() + 1);

    var cells = buildCells(task, state.viewYear, state.viewMonth).map(cellHtml).join('');

    document.getElementById('detailBody').innerHTML =
      '<div class="detail-head">' +
        '<div class="detail-title">' + esc(task.title) + '</div>' +
        '<div class="detail-badge">已签到 ' + s.total + ' 天</div>' +
      '</div>' +
      '<div class="detail-sub">开始于 ' + esc(humanDate(task.createdAt, state.today)) + '</div>' +
      '<div class="stat-row">' +
        '<div class="stat"><div class="stat-num">' + s.total + '</div><div class="stat-label">累计签到</div></div>' +
        '<div class="stat"><div class="stat-num">' + s.streak + '</div><div class="stat-label">连续签到</div></div>' +
        '<div class="stat"><div class="stat-num is-missed">' + s.missed + '</div><div class="stat-label">未签到</div></div>' +
      '</div>' +
      '<div class="month-nav">' +
        '<button type="button" class="nav-btn' + (canPrev ? '' : ' is-disabled') + '" data-action="prev"' +
          ' aria-label="上个月"' + (canPrev ? '' : ' aria-disabled="true"') + '>‹</button>' +
        '<div class="month-label">' + state.viewYear + '年' + state.viewMonth + '月</div>' +
        '<button type="button" class="nav-btn' + (canNext ? '' : ' is-disabled') + '" data-action="next"' +
          ' aria-label="下个月"' + (canNext ? '' : ' aria-disabled="true"') + '>›</button>' +
      '</div>' +
      '<div class="cal-weekdays">' +
        WEEK.map(function (w) { return '<span>' + w + '</span>'; }).join('') +
      '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="legend">' +
        '<span class="legend-item"><span class="legend-dot dot-chk"></span>已签到</span>' +
        '<span class="legend-item"><span class="legend-dot dot-miss"></span>未签到</span>' +
        '<span class="legend-item"><span class="legend-dot dot-pend"></span>待签到</span>' +
      '</div>' +
      '<div class="detail-tip">点日期可以补签或取消签到</div>' +
      '<div class="detail-foot">' +
        '<button type="button" class="btn-text btn-danger" data-action="delete">删除任务</button>' +
        '<button type="button" class="btn-text" data-action="close-detail">完成</button>' +
      '</div>';
  }

  function buildCells(task, year, month) {
    var map = {};
    task.days.forEach(function (d) { map[d] = true; });

    var cells = [];
    var lead = new Date(year, month - 1, 1).getDay();
    var total = new Date(year, month, 0).getDate();
    var i;
    for (i = 0; i < lead; i += 1) cells.push(null);

    for (i = 1; i <= total; i += 1) {
      var key = year + '-' + pad2(month) + '-' + pad2(i);
      var cls;
      if (key > state.today) cls = 'fut';
      else if (key < task.createdAt) cls = 'pre';
      else if (map[key]) cls = 'chk';
      else if (key === state.today) cls = 'pend';
      else cls = 'miss';
      cells.push({ date: key, day: i, cls: cls, off: cls === 'fut' || cls === 'pre' });
    }
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }

  function cellHtml(c) {
    if (!c) return '<span class="cal-cell"></span>';
    var today = c.date === state.today ? ' today' : '';
    return '<button type="button" class="cal-cell" data-action="cell" data-date="' + c.date + '"' +
      (c.off ? ' aria-disabled="true"' : '') + '>' +
      '<span class="cal-day ' + c.cls + today + '">' + c.day + '</span>' +
    '</button>';
  }

  function tapCell(date) {
    var task = findTask(state.detailId);
    if (!task || !date) return;
    if (date > state.today) { toast('还没到这一天'); return; }
    if (date < task.createdAt) { toast('任务开始前无法补签'); return; }

    var on = task.days.indexOf(date) < 0;
    if (on) {
      task.days.push(date);
      task.days.sort();
    } else {
      task.days.splice(task.days.indexOf(date), 1);
    }
    commit();
    toast((on ? '已签到 ' : '已取消 ') + humanDate(date, state.today));
  }

  function changeMonth(delta) {
    var y = state.viewYear;
    var m = state.viewMonth + delta;
    if (m < 1) { m = 12; y -= 1; }
    if (m > 12) { m = 1; y += 1; }

    var td = parseDate(state.today);
    var ok = (y > state.startYear || (y === state.startYear && m >= state.startMonth)) &&
      (y < td.getFullYear() || (y === td.getFullYear() && m <= td.getMonth() + 1));
    if (!ok) return;

    state.viewYear = y;
    state.viewMonth = m;
    renderDetail();
  }

  function deleteTask() {
    var task = findTask(state.detailId);
    if (!task) return;

    askConfirm({
      title: '删除任务',
      text: '「' + task.title + '」的签到记录会一起删除，无法恢复。',
      confirmText: '删除',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      state.tasks = state.tasks.filter(function (t) { return t.id !== task.id; });
      state.detailId = null;
      hideOverlay('detailOverlay');
      commit();
      toast('已删除');
    });
  }

  /* ================= 提交 ================= */
  function commit() {
    writeRaw(state.tasks);
    render();
    if (state.detailId) renderDetail();
  }

  /* ================= 弹层 ================= */
  var OVERLAYS = ['editorOverlay', 'detailOverlay', 'confirmOverlay'];

  function showOverlay(id) {
    document.getElementById(id).hidden = false;
    document.body.classList.add('lock');
  }
  function hideOverlay(id) {
    document.getElementById(id).hidden = true;
    var anyOpen = OVERLAYS.some(function (o) {
      return !document.getElementById(o).hidden;
    });
    if (!anyOpen) document.body.classList.remove('lock');
  }

  var confirmResolve = null;
  function askConfirm(opts) {
    document.getElementById('confirmTitle').textContent = opts.title;
    document.getElementById('confirmText').textContent = opts.text || '';
    var yes = document.getElementById('confirmYes');
    yes.textContent = opts.confirmText || '确定';
    yes.classList.toggle('danger', !!opts.danger);
    showOverlay('confirmOverlay');
    return new Promise(function (resolve) { confirmResolve = resolve; });
  }
  function resolveConfirm(value) {
    hideOverlay('confirmOverlay');
    var fn = confirmResolve;
    confirmResolve = null;
    if (fn) fn(value);
  }

  /* ================= 提示 ================= */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  /* ================= 事件 ================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) {
      var card = e.target.closest('.card');
      if (card) openDetail(card.dataset.id);
      return;
    }
    switch (el.dataset.action) {
      case 'toggle-today': toggleToday(el.dataset.id); break;
      case 'open-editor': openEditor(); break;
      case 'close-editor': closeEditor(); break;
      case 'create': createTask(); break;
      case 'close-detail': closeDetail(); break;
      case 'prev': changeMonth(-1); break;
      case 'next': changeMonth(1); break;
      case 'delete': deleteTask(); break;
      case 'cell': tapCell(el.dataset.date); break;
      case 'confirm-yes': resolveConfirm(true); break;
      case 'confirm-no': resolveConfirm(false); break;
      default: break;
    }
  });

  OVERLAYS.forEach(function (id) {
    var box = document.getElementById(id);
    box.addEventListener('click', function (e) {
      if (e.target !== box) return;
      if (id === 'confirmOverlay') resolveConfirm(false);
      else if (id === 'editorOverlay') closeEditor();
      else closeDetail();
    });
  });

  document.getElementById('taskInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); createTask(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!document.getElementById('confirmOverlay').hidden) { resolveConfirm(false); return; }
    if (!document.getElementById('editorOverlay').hidden) { closeEditor(); return; }
    if (!document.getElementById('detailOverlay').hidden) closeDetail();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    render();
    if (state.detailId) renderDetail();
  });

  /* ================= 启动 ================= */
  state.tasks = normalize(readRaw());
  state.today = todayKey();
  render();

  window.__checkin = state;
})();
</script>

(function () {
  if (!('serviceWorker' in navigator)) return;
  var host = location.hostname;
  var secure = location.protocol === 'https:' || host === 'localhost' || host === '127.0.0.1';
  if (!secure) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
  });
})();
</script>
